# ==============================================================================
# Nginx Reverse Proxy Institucional - Comedor UNSCH
# Perímetro OTI (Oficina de Tecnologías de la Información)
# Dominio Institucional: comedor.unsch.edu.pe
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ocultar versión del servidor web (Security Hardening)
    server_tokens off;

    # Formato de registro seguro con IP real de cliente
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Límite máximo de carga en el body (2M defensivo para Next.js y subida de fotos WebP/JPEG <= 500KB)
    client_max_body_size 2M;

    # --------------------------------------------------------------------------
    # Rate Limiting Perimetral por IP
    # --------------------------------------------------------------------------
    # Zona de limitación para endpoints sensibles (login, autenticación y subida de fotos)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_status 429;

    # Upstream al contenedor Next.js standalone (puerto interno 3000)
    upstream next_app {
        server app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name comedor.unsch.edu.pe localhost;

        # ----------------------------------------------------------------------
        # Cabeceras HTTP de Seguridad Estrictas
        # ----------------------------------------------------------------------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Content-Security-Policy: política balanceada sin 'unsafe-eval'
        # Permite Next.js, fuentes institucionales (Google Fonts) y flujo OAuth de Google Workspace
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://accounts.google.com https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com;" always;

        # ----------------------------------------------------------------------
        # Endpoint Sensible: Subida de fotografías
        # ----------------------------------------------------------------------
        location /api/upload {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # Endpoints Sensibles: Autenticación institucional y Login
        # ----------------------------------------------------------------------
        location /api/auth {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        location /login {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----------------------------------------------------------------------
        # Servicio Seguro de Archivos Estáticos /uploads
        # ----------------------------------------------------------------------
        location /uploads/ {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cabeceras defensivas para neutralizar ejecución de código
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            add_header Content-Disposition "inline" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ----------------------------------------------------------------------
        # Enrutamiento General a Next.js Standalone
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
